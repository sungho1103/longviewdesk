<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>롱뷰 데스크</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Source+Sans+3:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  /* ============ Tokens ============ */
  :root{
    --bg: #eeece7;
    --surface: #ffffff;
    --surface-2: #f7f5f1;
    --surface-3: #e9e6df;
    --ink: #1c1b18;
    --ink-soft: #5a5852;
    --ink-faint: #8b8880;
    --line: #ddd9d0;
    --line-soft: #e7e3da;
    --accent: #1c1b18;
    --accent-soft: #e9e6df;
    --accent-ink: #ffffff;
    --pine: #1c1b18;
    --pine-soft: #e9e6df;
    --good: #2f7a52;
    --good-bg: #e4f0e6;
    --warn: #a06617;
    --warn-bg: #f4ead4;
    --bad: #b23b2e;
    --bad-bg: #f5e2de;
    --score-g1: #dcefe0;
    --score-g2: #b3ddba;
    --score-g3: #82c491;
    --score-g4: #4fa367;
    --score-g5: #1f7a45;
    --score-r1: #f6dedb;
    --score-r2: #edb7ae;
    --score-r3: #dd8b7c;
    --score-r4: #c95f48;
    --score-r5: #b23b2e;
    --shadow: 0 1px 2px rgba(20,19,16,0.06), 0 6px 20px -8px rgba(20,19,16,0.12);
    --radius: 10px;
    --font-display: "Fraunces", Georgia, "Noto Serif KR", serif;
    --font-body: "Source Sans 3", "Pretendard", "Apple SD Gothic Neo", sans-serif;
    --font-mono: "IBM Plex Mono", "SFMono-Regular", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg: #121212;
      --surface: #1a1a19;
      --surface-2: #202020;
      --surface-3: #292825;
      --ink: #eeece6;
      --ink-soft: #a8a69e;
      --ink-faint: #79776f;
      --line: #313029;
      --line-soft: #26251f;
      --accent: #eeece6;
      --accent-soft: #26251f;
      --accent-ink: #121212;
      --pine: #eeece6;
      --pine-soft: #26251f;
      --good: #6cbf8f;
      --good-bg: #1a3324;
      --warn: #d9a75c;
      --warn-bg: #392c11;
      --bad: #e08072;
      --bad-bg: #3a1e17;
      --score-g1: #2c4535;
      --score-g2: #3d6949;
      --score-g3: #4f8f5e;
      --score-g4: #63b673;
      --score-g5: #7de08c;
      --score-r1: #4a2b26;
      --score-r2: #6b3c33;
      --score-r3: #925043;
      --score-r4: #c06853;
      --score-r5: #e08072;
      --shadow: 0 1px 2px rgba(0,0,0,0.35), 0 10px 28px -10px rgba(0,0,0,0.55);
    }
  }
  :root[data-theme="dark"]{
    --bg: #121212;
    --surface: #1a1a19;
    --surface-2: #202020;
    --surface-3: #292825;
    --ink: #eeece6;
    --ink-soft: #a8a69e;
    --ink-faint: #79776f;
    --line: #313029;
    --line-soft: #26251f;
    --accent: #eeece6;
    --accent-soft: #26251f;
    --accent-ink: #121212;
    --pine: #eeece6;
    --pine-soft: #26251f;
    --good: #6cbf8f;
    --good-bg: #1a3324;
    --warn: #d9a75c;
    --warn-bg: #392c11;
    --bad: #e08072;
    --bad-bg: #3a1e17;
    --score-g1: #2c4535;
    --score-g2: #3d6949;
    --score-g3: #4f8f5e;
    --score-g4: #63b673;
    --score-g5: #7de08c;
    --score-r1: #4a2b26;
    --score-r2: #6b3c33;
    --score-r3: #925043;
    --score-r4: #c06853;
    --score-r5: #e08072;
    --shadow: 0 1px 2px rgba(0,0,0,0.35), 0 10px 28px -10px rgba(0,0,0,0.55);
  }

  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:var(--font-body);
    font-size:17.5px;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;}
  }
  ::selection{ background:var(--accent-soft); }
  a{ color:inherit; }
  button{ font-family:inherit; }
  input,textarea,select{ font-family:inherit; }
  :focus-visible{ outline:2px solid var(--accent); outline-offset:2px; border-radius:4px; }
  .tnum{ font-variant-numeric: tabular-nums; }
  .mono{ font-family:var(--font-mono); }

  /* ============ Shell ============ */
  .app{
    display:grid;
    grid-template-columns: 296px 1fr;
    min-height:100vh;
    align-items:start;
  }
  @media (max-width: 880px){
    .app{ grid-template-columns: 1fr; }
    .sidebar{ position:relative; width:100%; height:auto; border-right:none; border-bottom:1px solid var(--line); }
  }

  /* ---- Sidebar ---- */
  .sidebar{
    position:sticky; top:0;
    height:100vh;
    display:flex; flex-direction:column;
    background:var(--surface);
    border-right:1px solid var(--line);
  }
  @media (max-width:880px){ .sidebar{ position:static; height:auto; } }

  .brand{
    padding:22px 20px 16px;
    border-bottom:1px solid var(--line-soft);
  }
  .brand-mark{
    display:flex; align-items:baseline; gap:8px;
  }
  .brand-mark .ledger-icon{
    width:20px; height:20px; flex:none;
    color:var(--pine);
  }
  .brand-name{
    font-family:var(--font-display);
    font-weight:600;
    font-size:22px;
    letter-spacing:-0.01em;
  }
  .brand-sub{
    margin-top:4px;
    font-size:13px;
    color:var(--ink-faint);
    letter-spacing:0.04em;
  }

  .tabbar{
    display:flex; gap:4px;
    padding:12px 16px 8px;
  }
  .tab-btn{
    flex:1;
    border:1px solid transparent;
    background:transparent;
    color:var(--ink-soft);
    padding:8px 10px;
    border-radius:8px;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
    transition:background .12s, color .12s;
  }
  .tab-btn:hover{ background:var(--surface-2); }
  .tab-btn.active{
    background:var(--pine-soft);
    color:var(--pine);
  }

  .side-section{ padding:10px 16px; }
  .side-label{
    font-size:12.5px; text-transform:uppercase; letter-spacing:0.08em;
    color:var(--ink-faint); font-weight:600; margin:6px 2px 8px;
  }

  .add-toggle{
    width:100%; display:flex; align-items:center; justify-content:center; gap:6px;
    background:var(--surface-2); border:1px dashed var(--line);
    color:var(--ink-soft); border-radius:8px; padding:9px; font-size:15px; font-weight:600;
    cursor:pointer; transition:border-color .12s, color .12s;
  }
  .add-toggle:hover{ border-color:var(--accent); color:var(--accent); }

  .add-form{
    margin-top:10px; padding:12px; border:1px solid var(--line); border-radius:10px;
    background:var(--surface-2);
    display:flex; flex-direction:column; gap:8px;
  }
  .add-form input, .add-form select{
    width:100%; padding:7px 9px; border:1px solid var(--line); border-radius:6px;
    background:var(--surface); color:var(--ink); font-size:15px;
  }
  .add-form .row2{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .btn{
    border:none; border-radius:7px; padding:8px 12px; font-size:15px; font-weight:600;
    cursor:pointer; transition:opacity .12s, transform .05s;
  }
  .btn:active{ transform:scale(0.98); }
  .btn-primary{ background:var(--pine); color:var(--accent-ink); }
  .btn-primary:hover{ opacity:0.9; }
  .btn-ghost{ background:transparent; color:var(--ink-soft); border:1px solid var(--line); }
  .btn-ghost:hover{ background:var(--surface-3); }
  .btn-accent{ background:var(--accent); color:var(--accent-ink); }
  .btn-accent:hover{ opacity:0.92; }
  .btn-danger{ background:transparent; color:var(--bad); border:1px solid var(--bad); }
  .btn-danger:hover{ background:var(--bad-bg); }
  .btn-sm{ padding:5px 9px; font-size:14px; border-radius:6px; }

  .ticker-list{
    flex:1; overflow-y:auto; padding:4px 10px 12px;
    scrollbar-width:thin; scrollbar-color:var(--ink-faint) transparent;
  }
  .ticker-list::-webkit-scrollbar{ width:8px; }
  .ticker-list::-webkit-scrollbar-track{ background:transparent; }
  .ticker-list::-webkit-scrollbar-thumb{
    background-color:var(--ink-faint); border-radius:8px;
    border:2px solid transparent; background-clip:padding-box;
  }
  .ticker-list::-webkit-scrollbar-thumb:hover{ background-color:var(--ink-soft); }
  @media (max-width:880px){
    .ticker-list{ max-height:240px; overflow-y:auto; }
  }
  .ticker-item{
    display:flex; align-items:center; gap:10px;
    padding:9px 10px; border-radius:9px; cursor:pointer;
    border:1px solid transparent;
    margin-bottom:3px;
    background:var(--surface);
  }
  .ticker-item:nth-child(even){ background:var(--surface-2); }
  .ticker-item:hover{ background:var(--surface-3); }
  .ticker-item.active{ background:var(--pine-soft); border-color:var(--pine-soft); }
  .ticker-item .ti-main{ flex:1; min-width:0; }
  .ticker-item .ti-code{
    font-family:var(--font-mono); font-size:14.5px; font-weight:600; color:var(--pine);
    letter-spacing:0.02em;
  }
  .ticker-item.active .ti-code{ color:var(--pine); }
  .ticker-item .ti-name{
    font-size:15px; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .ticker-item .ti-meta{ display:flex; align-items:center; gap:5px; flex:none; }
  .example-dot{
    width:6px;height:6px;border-radius:50%;background:var(--warn); flex:none;
  }
  .refresh-pending-icon{
    width:13px; height:13px; flex:none; color:var(--accent);
  }

  .empty-side{
    padding:18px 10px; color:var(--ink-faint); font-size:15px; text-align:center;
  }

  .sidebar-footer{
    padding:12px 16px 16px; border-top:1px solid var(--line-soft);
    display:flex; flex-direction:column; gap:6px;
  }
  .footer-toggle{
    background:none; border:none; color:var(--ink-faint); font-size:13px; font-weight:600;
    cursor:pointer; padding:2px 0; display:flex; align-items:center; gap:5px; width:100%;
  }
  .footer-toggle:hover{ color:var(--ink-soft); }
  .footer-toggle svg{ transition:transform .15s; }
  .footer-toggle.open svg{ transform:rotate(180deg); }
  .footer-details{ display:flex; flex-direction:column; gap:6px; margin-top:6px; }
  .footer-details.hidden{ display:none; }
  .footer-note{ font-size:12.5px; color:var(--ink-faint); line-height:1.5; }
  .link-btn{
    background:none; border:none; color:var(--ink-faint); font-size:13px; text-decoration:underline;
    cursor:pointer; padding:0; text-align:left; width:fit-content;
  }
  .link-btn:hover{ color:var(--bad); }

  .pending-banner{
    background:var(--warn-bg); border:1px solid transparent; border-radius:9px;
    padding:9px 11px; font-size:13px; color:var(--warn); line-height:1.5;
    display:flex; flex-direction:column; gap:5px;
  }
  .pending-banner b{ font-weight:700; }
  .pending-banner .pb-hint{ color:var(--ink-soft); font-weight:500; }

  /* ---- Main ---- */
  .main{ padding:32px 36px 80px; max-width:1040px; }
  @media (max-width:880px){ .main{ padding:20px 16px 60px; } }

  .top-disclaimer{
    display:flex; gap:8px; align-items:flex-start;
    background:var(--surface-2); border:1px solid var(--line-soft); border-radius:10px;
    padding:10px 13px; margin-bottom:24px; font-size:14.5px; color:var(--ink-soft);
  }
  .top-disclaimer svg{ flex:none; margin-top:2px; color:var(--ink-faint); width:15px; height:15px; }

  /* Empty state */
  .empty-main{
    display:flex; flex-direction:column; align-items:flex-start; gap:14px;
    padding:60px 4px;
    max-width:520px;
  }
  .empty-main h1{
    font-family:var(--font-display); font-size:32px; font-weight:600; margin:0;
  }
  .empty-main p{ color:var(--ink-soft); margin:0; }

  /* Stock header */
  .stock-head{
    display:flex; flex-wrap:wrap; align-items:flex-start; justify-content:space-between; gap:16px;
    margin-bottom:18px;
  }
  .stock-title-row{ display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; }
  .stock-ticker{
    font-family:var(--font-mono); font-weight:600; font-size:16px; color:var(--pine);
    background:var(--pine-soft); padding:3px 8px; border-radius:6px; letter-spacing:0.02em;
  }
  .stock-name{
    font-family:var(--font-display); font-weight:600; font-size:31px; letter-spacing:-0.01em;
    text-wrap:balance;
  }
  .chip{
    display:inline-flex; align-items:center; font-size:13px; font-weight:600;
    padding:3px 8px; border-radius:99px; border:1px solid var(--line);
    color:var(--ink-soft); background:var(--surface-2);
  }
  .chip-row{ display:flex; gap:6px; margin-top:6px; flex-wrap:wrap; }
  .example-chip{ color:var(--warn); background:var(--warn-bg); border-color:transparent; }
  .updated-chip{ color:var(--ink-faint); }
  .pending-chip{ color:var(--warn); background:var(--warn-bg); border-color:transparent; display:inline-flex; align-items:center; gap:4px; }
  .pending-chip .pc-dot{ width:6px; height:6px; border-radius:50%; background:var(--warn); }

  .btn-refresh{ background:var(--surface); color:var(--pine); border:1px solid var(--pine); }
  .btn-refresh:hover{ background:var(--pine-soft); }
  .btn-refresh.is-pending{ background:var(--warn-bg); color:var(--warn); border-color:transparent; }

  .head-actions{ display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end; }

  .stat-strip{
    display:flex; flex-wrap:wrap; gap:0;
    border:1px solid var(--line); border-radius:12px; overflow:hidden;
    background:var(--surface); margin-bottom:20px;
  }
  .stat-cell{
    flex:1; min-width:110px;
    padding:12px 16px;
    border-right:1px solid var(--line-soft);
  }
  .stat-cell:last-child{ border-right:none; }
  .stat-label{ font-size:12.5px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:0.05em; margin-bottom:3px; }
  .stat-value{ font-family:var(--font-mono); font-size:19.5px; font-weight:600; }
  .stat-cell input{
    width:100%; border:none; background:transparent; font-family:var(--font-mono); font-size:19.5px;
    font-weight:600; color:var(--ink); padding:0;
  }
  .fx-note{ font-size:13px; color:var(--ink-faint); font-weight:500; margin-top:2px; }

  .snapshot-strip{
    display:grid; grid-template-columns:repeat(4,1fr); gap:1px;
    background:var(--line); border:1px solid var(--line); border-radius:12px; overflow:hidden;
    margin-bottom:22px;
  }
  @media (max-width:640px){ .snapshot-strip{ grid-template-columns:repeat(2,1fr); } }
  .snap-cell{ background:var(--surface); padding:13px 15px; }
  .snap-label{ font-size:13px; color:var(--ink-soft); font-weight:600; margin-bottom:7px; }
  .dots{ display:flex; gap:4px; }
  .dot{ width:9px; height:9px; border-radius:50%; background:var(--line); }
  .dot.on{ background:var(--score-g5); }
  .dot.on.lv1{ background:var(--score-g1); }
  .dot.on.lv2{ background:var(--score-g2); }
  .dot.on.lv3{ background:var(--score-g3); }
  .dot.on.lv4{ background:var(--score-g4); }
  .dot.on.lv5{ background:var(--score-g5); }
  .dot.risk-on{ background:var(--score-r5); }
  .dot.risk-on.lv1{ background:var(--score-r1); }
  .dot.risk-on.lv2{ background:var(--score-r2); }
  .dot.risk-on.lv3{ background:var(--score-r3); }
  .dot.risk-on.lv4{ background:var(--score-r4); }
  .dot.risk-on.lv5{ background:var(--score-r5); }
  .dot.risk-off{ background:var(--line); }

  .section-label{
    font-size:14px; font-weight:700; letter-spacing:0.06em; text-transform:uppercase;
    color:var(--ink-faint); margin:26px 0 10px;
  }
  .summary-toggle{
    background:none; border:none; padding:0; margin:0 0 10px;
    font-size:14px; font-weight:700; letter-spacing:0.06em; text-transform:uppercase;
    color:var(--ink-faint); cursor:pointer;
    display:flex; align-items:center; gap:6px; width:100%;
  }
  .summary-toggle:hover{ color:var(--ink-soft); }
  .holdings-sort-select{
    text-transform:none; letter-spacing:normal; font-weight:600; font-size:13.5px;
    color:var(--ink-soft); background:var(--surface); border:1px solid var(--line);
    border-radius:7px; padding:5px 8px; cursor:pointer;
  }
  .summary-toggle svg{ transition:transform .15s; flex:none; }
  .summary-toggle.open svg{ transform:rotate(180deg); }

  .note-block{
    background:var(--surface); border:1px solid var(--line); border-left:4px solid var(--pine);
    border-radius:12px; padding:15px 17px 15px 14px; margin-bottom:22px; color:var(--ink-soft);
    font-size:16px; line-height:1.65;
  }
  .note-block textarea{
    width:100%; border:none; background:transparent; resize:vertical; min-height:64px;
    font-family:inherit; font-size:16px; color:var(--ink); line-height:1.65;
  }

  .card-grid{
    display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:8px;
  }
  @media (max-width:700px){ .card-grid{ grid-template-columns:1fr; } }

  .a-card{
    background:var(--surface); border:1px solid var(--line); border-radius:12px;
    padding:16px 17px; box-shadow:var(--shadow);
    display:flex; flex-direction:column; gap:10px;
  }
  .a-card-head{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .a-card-title{ font-weight:700; font-size:16.5px; display:flex; align-items:center; gap:7px; }
  .a-card-title .ic{ width:16px; height:16px; color:var(--pine); flex:none; }
  .a-card.risk .a-card-title .ic{ color:var(--bad); }
  .a-summary{ font-size:15.5px; color:var(--ink-soft); line-height:1.6; }
  .a-summary textarea{ width:100%; border:1px solid var(--line); border-radius:6px; padding:7px 8px; min-height:50px; font-size:15.5px; background:var(--surface-2); color:var(--ink); }
  .a-points{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:6px; }
  .a-points li{ font-size:15px; color:var(--ink); display:flex; gap:7px; }
  .a-points li::before{ content:"·"; color:var(--ink-faint); font-weight:700; }
  .a-card.risk .a-points li::before{ color:var(--bad); }
  .a-points textarea{ width:100%; border:1px solid var(--line); border-radius:6px; padding:7px 8px; min-height:70px; font-size:15px; background:var(--surface-2); color:var(--ink); }

  .valuation-verdict{
    display:inline-flex; align-self:flex-start; align-items:center; gap:6px;
    font-size:14px; font-weight:700; padding:4px 9px; border-radius:99px;
  }
  .verdict-under{ background:var(--good-bg); color:var(--good); }
  .verdict-fair{ background:var(--warn-bg); color:var(--warn); }
  .verdict-over{ background:var(--bad-bg); color:var(--bad); }

  .edit-num-row{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .edit-field label{ display:block; font-size:12.5px; color:var(--ink-faint); margin-bottom:3px; }
  .edit-field input, .edit-field select{
    width:100%; border:1px solid var(--line); border-radius:6px; padding:6px 8px; font-size:15px;
    background:var(--surface-2); color:var(--ink);
  }

  /* Industry cycle */
  .cycle-card{
    background:var(--surface); border:1px solid var(--line); border-radius:12px;
    padding:17px 19px; margin-bottom:22px; box-shadow:var(--shadow);
  }
  .cycle-track{
    position:relative; height:6px; border-radius:99px; background:var(--surface-3);
    margin:16px 4px 20px;
  }
  .cycle-fill{ position:absolute; left:0; top:0; bottom:0; border-radius:99px; background:linear-gradient(90deg, var(--pine), var(--accent)); }
  .cycle-dot{
    position:absolute; top:50%; width:14px; height:14px; border-radius:50%;
    background:var(--surface); border:3px solid var(--accent); transform:translate(-50%,-50%);
    box-shadow:0 0 0 3px var(--surface);
  }

<script>
(function(){
"use strict";

/* ============ Utilities ============ */
function esc(s){
  if(s===undefined||s===null) return "";
  return String(s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}
function fmtMoney(v, currency){
  v = Number(v)||0;
  if(currency==="USD"){
    return "$" + v.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
  }
  return "₩" + Math.round(v).toLocaleString("ko-KR");
}
function fmtMoneyShort(v, currency){
  v = Number(v)||0;
  if(currency==="USD"){
    if(Math.abs(v)>=1e12) return "$"+(v/1e12).toFixed(2)+"T";
    if(Math.abs(v)>=1e9) return "$"+(v/1e9).toFixed(2)+"B";
    if(Math.abs(v)>=1e6) return "$"+(v/1e6).toFixed(1)+"M";
    return "$"+v.toLocaleString("en-US",{maximumFractionDigits:2});
  }
  if(Math.abs(v)>=1e12) return "₩"+(v/1e12).toFixed(1)+"조";
  if(Math.abs(v)>=1e8) return "₩"+(v/1e8).toFixed(0)+"억";
  return "₩"+Math.round(v).toLocaleString("ko-KR");
}
function fmtPct(v, digits){
  digits = digits===undefined?1:digits;
  v = Number(v)||0;
  var sign = v>0?"+":"";
  return sign + v.toFixed(digits) + "%";
}
function currencyOf(market){ return market==="US" ? "USD" : "KRW"; }
// A holding can be tracked in a different currency than the stock it's
// linked to actually trades in (e.g. cost basis entered in KRW for a
// US-market ticker bought through a won-settled account) — convert any
// amount coming from the linked stock's native currency into the
// holding's own tracked currency before displaying/summing it.
function convertCurrency(amount, fromCur, toCur){
  if(amount==null || fromCur===toCur) return amount;
  if(fromCur==="USD" && toCur==="KRW") return amount*getFxRate();
  if(fromCur==="KRW" && toCur==="USD") return amount/getFxRate();
  return amount;
}

var FX_KEY = "longview_desk_fx_v1";
function getFxRate(){
  try{
    var v = parseFloat(localStorage.getItem(FX_KEY));
    if(v && v>0) return v;
  }catch(e){}
  return 1380; // fallback default (approximate USD/KRW)
}
function setFxRate(v){
  try{ localStorage.setItem(FX_KEY, String(v)); }catch(e){}
}
function fxNoteHtml(usdAmount){
  var krw = usdAmount * getFxRate();
  return '<div class="fx-note tnum">≈ '+fmtMoney(krw,"KRW")+'</div>';
}
function linesToArr(text){
  return String(text||"").split("\n").map(function(s){return s.trim();}).filter(Boolean);
}
function uid(){ return "id"+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function b64EncodeUtf8(str){
  return btoa(unescape(encodeURIComponent(str)));
}
function b64DecodeUtf8(str){
  // read_file_content returns a "natural language representation" of the file,
  // which markdown-escapes brackets/underscores in raw JSON — wrapping the
  // payload in base64 sidesteps that. Defensively pull out the base64 run in
  // case anything incidental (whitespace, code-fence backticks) got added.
  var m = String(str||"").match(/[A-Za-z0-9+/=]{20,}/);
  var b64 = m ? m[0] : String(str||"").trim();
  return decodeURIComponent(escape(atob(b64)));
}
function safeStringify(obj){
  try{
    var seen = [];
    return JSON.stringify(obj, function(k,v){
      if(v && typeof v==="object"){ if(seen.indexOf(v)>=0) return "[circular]"; seen.push(v); }
      if(v instanceof Error) return {name:v.name, message:v.message, stack:v.stack};
      return v;
    });
  }catch(e){ return String(obj); }
}

function showToast(msg){
  var t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(showToast._t);
  showToast._t = setTimeout(function(){ t.classList.remove("show"); }, 2200);
}

var LAST_SYNC_KEY = "longview_desk_last_sync_v1";
function fmtSyncTime(iso){
  var d = new Date(iso);
  if(isNaN(d.getTime())) return "";
  var pad = function(n){ return (n<10?"0":"")+n; };
  return (d.getMonth()+1)+"/"+d.getDate()+" "+pad(d.getHours())+":"+pad(d.getMinutes());
}
function fmtKstDate(iso){
  var d = new Date(iso);
  if(isNaN(d.getTime())) return "";
  return new Date(d.getTime()+9*3600*1000).toISOString().slice(0,10);
}
function renderLastSync(){
  var el = document.getElementById("lastSyncInfo");
  if(!el) return;
  var raw;
  try{ raw = localStorage.getItem(LAST_SYNC_KEY); }catch(e){ raw = null; }
  if(!raw){ el.textContent = ""; return; }
  var info;
  try{ info = JSON.parse(raw); }catch(e){ el.textContent = ""; return; }
  var label = info.source==="import" ? "가져오기로 갱신"
    : info.source==="reload" ? "다시 불러옴"
    : "저장됨";
  el.textContent = "이 기기에서 마지막 "+(info.source==="import"?"가져오기":info.source==="reload"?"불러오기":"저장")+": "+fmtSyncTime(info.at);
}
function markLastSync(source){
  var info = {at: new Date().toISOString(), source: source};
  try{ localStorage.setItem(LAST_SYNC_KEY, JSON.stringify(info)); }catch(e){}
  renderLastSync();
}

// Native confirm()/alert() are unreliable inside a sandboxed artifact iframe
// (silently blocked or auto-dismissed depending on the host), so destructive
// actions use this in-page modal instead.
function appConfirm(message, onYes){
  var overlay = document.createElement("div");
  overlay.className = "modal-overlay";
  var box = document.createElement("div");
  box.className = "modal-box";
  box.style.maxWidth = "380px";
  var title = document.createElement("div");
  title.className = "modal-title";
  title.textContent = "확인";
  var hint = document.createElement("div");
  hint.className = "modal-hint";
  hint.style.marginBottom = "16px";
  hint.textContent = message;
  var actions = document.createElement("div");
  actions.className = "modal-actions";
  var noBtn = document.createElement("button");
  noBtn.className = "btn btn-ghost";
  noBtn.textContent = "취소";
  var yesBtn = document.createElement("button");
  yesBtn.className = "btn btn-danger";
  yesBtn.textContent = "확인";
  actions.appendChild(noBtn);
  actions.appendChild(yesBtn);
  box.appendChild(title);
  box.appendChild(hint);
  box.appendChild(actions);
  overlay.appendChild(box);
  document.body.appendChild(overlay);

  function close(){ document.body.removeChild(overlay); }
  noBtn.onclick = close;
  yesBtn.onclick = function(){ close(); onYes(); };
  overlay.onclick = function(e){ if(e.target===overlay) close(); };
}

/* ============ Data store (db capability with localStorage fallback) ============ */
var Store = (function(){
  var LS_KEY = "longview_desk_v1";
  var mode = "local"; // "db" | "local"
  var dbCap = null, uidVal = null;
  // Per-viewer private data lives under data/users/<uid>/... . A collection path
  // needs an ODD segment count, so "watchlist"/"holdings" must be subcollections
  // of a fixed per-user hub document (data/users/<uid>/hub), not siblings of it.
  function watchlistCol(){ return dbCap.doc("data/users/"+uidVal+"/hub").collection("watchlist"); }
  function holdingsCol(){ return dbCap.doc("data/users/"+uidVal+"/hub").collection("holdings"); }

  function lsRead(){
    try{ return JSON.parse(localStorage.getItem(LS_KEY)) || {watchlist:{}, holdings:{}}; }
    catch(e){ return {watchlist:{}, holdings:{}}; }
  }
  function lsWrite(data){
    try{ localStorage.setItem(LS_KEY, JSON.stringify(data)); }catch(e){}
  }

  async function init(){
    try{
      if(window.claude && window.claude.use){
        var db = await window.claude.use("db");
        var user = await window.claude.use("user");
        if(db && user){
          var id = await user.id();
          if(id){ dbCap = db; uidVal = id; mode = "db"; }
        }
      }
    }catch(e){ /* fall back silently */ }
  }

  async function loadAll(){
    if(mode==="db"){
      try{
        var wSnap = await watchlistCol().get();
        var hSnap = await holdingsCol().get();
        var watchlist = {}, holdings = {};
        wSnap.docs.forEach(function(d){ watchlist[d.id] = d.data(); });
        hSnap.docs.forEach(function(d){ holdings[d.id] = d.data(); });
        return {watchlist:watchlist, holdings:holdings};
      }catch(e){
        mode = "local";
        return lsRead();
      }
    }
    return lsRead();
  }

  async function saveStock(ticker, data){
    if(mode==="db"){
      try{ await watchlistCol().doc(ticker).set(data); return; }
      catch(e){ mode="local"; }
    }
    var all = lsRead(); all.watchlist[ticker] = data; lsWrite(all);
  }
  async function deleteStock(ticker){
    if(mode==="db"){
      try{ await watchlistCol().doc(ticker).delete(); return; }
      catch(e){ mode="local"; }
    }
    var all = lsRead(); delete all.watchlist[ticker]; lsWrite(all);
  }
  async function saveHolding(ticker, data){
    if(mode==="db"){
      try{ await holdingsCol().doc(ticker).set(data); return; }
      catch(e){ mode="local"; }
    }
    var all = lsRead(); all.holdings[ticker] = data; lsWrite(all);
  }
  async function deleteHolding(ticker){
    if(mode==="db"){
      try{ await holdingsCol().doc(ticker).delete(); return; }
      catch(e){ mode="local"; }
    }
    var all = lsRead(); delete all.holdings[ticker]; lsWrite(all);
  }

  function currentMode(){ return mode; }

  return {init:init, loadAll:loadAll, saveStock:saveStock, deleteStock:deleteStock, saveHolding:saveHolding, deleteHolding:deleteHolding, currentMode:currentMode, lsReadRaw:lsRead, lsWriteRaw:lsWrite};
})();

App.applyImport = function(){
  var raw = document.getElementById("syncTextarea").value;
  var parsed;
  try{ parsed = JSON.parse(raw); }
  catch(e){ showToast("JSON 형식이 올바르지 않습니다"); return; }
  if(!parsed || typeof parsed.watchlist!=="object" || typeof parsed.holdings!=="object"){
    showToast("관심 종목·포트폴리오 데이터 형식이 아닙니다");
    return;
  }
  appConfirm("현재 대시보드의 모든 종목·보유 내역을 가져온 데이터로 덮어씁니다. 계속할까요?", function(){
    Object.keys(state.watchlist).forEach(function(t){ if(!parsed.watchlist[t]) Store.deleteStock(t); });
    Object.keys(state.holdings).forEach(function(t){ if(!parsed.holdings[t]) Store.deleteHolding(t); });
    Object.keys(parsed.watchlist).forEach(function(t){ Store.saveStock(t, parsed.watchlist[t]); });
    Object.keys(parsed.holdings).forEach(function(t){ Store.saveHolding(t, parsed.holdings[t]); });

    state.watchlist = parsed.watchlist;
    state.holdings = parsed.holdings;
    var keys = Object.keys(state.watchlist);
    state.currentTicker = keys.length ? keys[0] : null;

    App.closeModal();
    render();
    markLastSync("import");
    showToast("데이터를 가져왔습니다");
  });
};

/* ============ Projection math ============ */
function projectStock(stock, years){
  var price = stock.overview.price || 0;
  var out = stock.outlook || {};
  var baseCagr = (out.baseCagr||0)/100;
  var bullCagr = (out.bullCagr||0)/100;
  var bearCagr = (out.bearCagr||0)/100;
  var divYield = (out.divYield||0)/100;
  var divGrowth = (out.divGrowth||0)/100;

  var basePrice = price * Math.pow(1+baseCagr, years);
  var bullPrice = price * Math.pow(1+bullCagr, years);
  var bearPrice = price * Math.pow(1+bearCagr, years);

  var annualDiv0 = price * divYield;
  var cumDiv = 0, divAtYear = annualDiv0;
  for(var y=1; y<=years; y++){
    divAtYear = annualDiv0 * Math.pow(1+divGrowth, y);
    cumDiv += divAtYear;
  }
  var yieldOnCost = price>0 ? (divAtYear/price*100) : 0;

  return {
    basePrice:basePrice, bullPrice:bullPrice, bearPrice:bearPrice,
    totalReturnPct: price>0 ? ((basePrice/price)-1)*100 : 0,
    cumDiv:cumDiv, divAtYear:divAtYear, yieldOnCost:yieldOnCost,
    hasDividend: divYield>0
  };
}

/* ============ Rendering ============ */
function dotsHtml(score, max, riskMode){
  max = max||5;
  var html = '<div class="dots">';
  for(var i=1;i<=max;i++){
    var cls = "dot";
    if(riskMode){ cls += (i<=score) ? (" risk-on lv"+score) : " risk-off"; }
    else { cls += (i<=score) ? (" on lv"+score) : ""; }
    html += '<span class="'+cls+'"></span>';
  }
  html += '</div>';
  return html;
}

function holdingShapeSvg(linked){
  if(!linked) return '<div class="hc-shape"><div class="hc-shape-empty" style="width:32px;height:32px;" title="관심 종목 미연동 · 분석 데이터 없음"></div></div>';
  var moat = linked.moat.score||0;
  var fin = linked.financials.score||0;
  var val = linked.valuation.score||0;
  var safety = 6-(linked.risk.score||0);
  var vals = [moat, fin, val, safety];
  var R = 24, CX = 30, CY = 30;
  var angles = [-90, 0, 90, 180];
  var pts = vals.map(function(v,i){
    var r = Math.max(2, (v/5)*R);
    var rad = angles[i]*Math.PI/180;
    return (CX+r*Math.cos(rad)).toFixed(1)+","+(CY+r*Math.sin(rad)).toFixed(1);
  }).join(" ");
  var axisLines = angles.map(function(a){
    var rad = a*Math.PI/180;
    return '<line x1="'+CX+'" y1="'+CY+'" x2="'+(CX+R*Math.cos(rad)).toFixed(1)+'" y2="'+(CY+R*Math.sin(rad)).toFixed(1)+'" class="hc-shape-axis"/>';
  }).join("");
  var p5 = projectStock(linked, 5);
  var upCls = p5.totalReturnPct>3 ? "up" : (p5.totalReturnPct<-3 ? "down" : "flat");
  var tip = '해자 '+moat+' · 재무 '+fin+' · 밸류 '+val+' · 안전성 '+safety+' (5점 만점) · 5년 후 예상 누적수익 '+fmtPct(p5.totalReturnPct);
  return '<div class="hc-shape" title="'+esc(tip)+'">'+
    '<svg viewBox="0 0 60 60" width="40" height="40">'+
      '<circle cx="'+CX+'" cy="'+CY+'" r="'+R+'" class="hc-shape-ring"/>'+
      '<circle cx="'+CX+'" cy="'+CY+'" r="'+(R/2)+'" class="hc-shape-ring"/>'+
      axisLines+
      '<polygon points="'+pts+'" class="hc-shape-poly '+upCls+'"/>'+
    '</svg>'+
  '</div>';
}

// A stock counts as a "buy signal" when its fundamentals are strong
// (solid moat + solid financials) but the market is pricing it well
// below its estimated fair value — the classic "good business, bad
// week" setup where a short-term issue has dragged the price down
// without changing the long-term case.
function isBuySignal(s){
  if(!s || !s.moat || !s.financials || !s.valuation || !s.overview) return false;
  if(!(s.moat.score>=4 && s.financials.score>=4)) return false;
  var v = s.valuation;
  if(!(s.overview.price>0 && (v.fairLow||v.fairHigh))) return false;
  var mid = (v.fairLow+v.fairHigh)/2;
  if(mid<=0) return false;
  var diff = (s.overview.price/mid-1)*100;
  return diff < -8;
}

    '<div class="issue-history">'+

  if(names.length) showToast("매수 신호 종목 "+names.length+"개: "+names.join(", "));
}

function holdingSortMetric(t){
  var h = state.holdings[t];
  var linked = state.watchlist[t];
  var cur = h.currency || (linked ? currencyOf(linked.market) : currencyOf(h.market));
  var curPrice = linked ? convertCurrency(linked.overview.price, currencyOf(linked.market), cur) : (h.currentPrice!=null ? h.currentPrice : null);
  var costBasis = h.shares*h.avgCost;
  var value = curPrice!=null ? h.shares*curPrice : costBasis;
  return {value:value, pnl:value-costBasis};
}

// Keeps the holding-row name within 2 lines: instead of letting the row
// grow taller, shrink the font until the (line-height-based) 2-line box
// stops clipping it.
function fitHcFullnames(){
  var els = document.querySelectorAll("#main .hc-fullname");
  for(var i=0;i<els.length;i++){
    var el = els[i];
    el.style.fontSize = "";
    var size = parseFloat(getComputedStyle(el).fontSize);
    var guard = 0;
    while(el.scrollHeight > el.clientHeight+1 && size>11 && guard<24){
      size -= 1;
      el.style.fontSize = size+"px";
      guard++;
    }
  }
}

function render(){
  renderSidebar();
  try{
    if(state.view==="watchlist") renderWatchlistView();
    else renderPortfolioView();
  }catch(e){
    console.error("[LongviewDesk][render] view render failed", e);
    var m = document.getElementById("main");
    if(m) m.innerHTML = '<div class="empty-main"><h1>화면을 그리는 중 오류가 발생했습니다</h1><p style="font-family:monospace;white-space:pre-wrap;">'+esc((e&&e.stack)||(e&&e.message)||String(e))+'</p></div>';
  }
  renderLastSync();
  var fxBtn = document.getElementById("fxRateBtn");
  if(fxBtn) fxBtn.textContent = "환율 설정 (1$ = ₩"+getFxRate().toLocaleString("ko-KR")+")";
}

(function initFooterToggle(){
  var open = false;
  try{ open = localStorage.getItem(FOOTER_OPEN_KEY)==="1"; }catch(e){}
  if(open){
    document.getElementById("footerDetails").classList.remove("hidden");

(async function boot(){
  // Deliberately do NOT paint seed/example data here. This is the very first
  // render before we know whether real data exists — showing example
  // tickers at this point (even briefly, even though nothing is persisted
  // from it) reads as "my portfolio just got wiped" to a returning user on
  // every single page load. state.ready stays false until we've actually
  // resolved real-vs-genuinely-empty, so the sidebar/main show a neutral
  // "불러오는 중…" instead.
  render();

  await Store.init();
  var storeStatusEl = document.getElementById("storeStatus");
  if(storeStatusEl){
    storeStatusEl.textContent = Store.currentMode()==="db"
      ? "저장 위치: 클라우드 (이 계정으로 로그인한 모든 기기와 자동 동기화)"
      : "저장 위치: 이 브라우저만 (로그인 상태에서만 기기 간 동기화됨)";
  }
  var loaded = await Store.loadAll();
  var loadedHasAny = Object.keys(loaded.watchlist).length || Object.keys(loaded.holdings).length;

  if(loadedHasAny){
    // The store (db — shared across every device signed into this account,
    // or this browser's localStorage as a fallback) already has real data.
    state.watchlist = loaded.watchlist;
    state.holdings = loaded.holdings;
  }else{
    // Store is empty. If we're in db mode, this specific browser's own
    // localStorage might still hold data saved before this device had db
    // access (or from before this migration) — migrate it up rather than
    // silently discarding it.
    var lsData = Store.lsReadRaw();
    var lsHasAny = Object.keys(lsData.watchlist).length || Object.keys(lsData.holdings).length;
    if(lsHasAny){
      state.watchlist = lsData.watchlist;
      state.holdings = lsData.holdings;
      Object.keys(lsData.watchlist).forEach(function(t){ Store.saveStock(t, lsData.watchlist[t]); });
      Object.keys(lsData.holdings).forEach(function(t){ Store.saveHolding(t, lsData.holdings[t]); });
      showToast("이전에 이 브라우저에 저장된 데이터를 동기화했습니다");
    }else{
      // Genuinely nothing anywhere yet — show examples for display only.
      // Nothing is persisted from this until the user takes a real action
      // (add a stock, edit a field, etc.), which goes through
      // Store.saveStock/saveHolding normally and is safe.
      var seed = seedData();
      state.watchlist = seed.watchlist;
      state.holdings = seed.holdings;
      showToast("예시 데이터를 보여드리고 있어요 — 관심 종목을 추가하면 저장이 시작됩니다.");
    }
  }

  if(!state.currentTicker || !state.watchlist[state.currentTicker]){
    var keys = Object.keys(state.watchlist);
    state.currentTicker = keys.length ? keys[0] : null;
  }
  state.ready = true;
  render();

  notifyBuySignals();
})();

})();
